name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # crates/evermesh-node is a Tauri 2 app, so `cargo clippy --workspace`
      # builds glib-sys/webkit against the system GTK stack. Without these the
      # job died at "The system library `glib-2.0` required by crate
      # `glib-sys` was not found" — before clippy linted a single line, so this
      # job has been reporting a lint failure that was really a missing apt
      # package. Same list the rest of the suite's Tauri builds install.
      - name: Install Linux system dependencies (webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # crates/evermesh-node embeds its frontend at compile time
      # (`tauri::generate_context!()`, `frontendDist: "./ui"`) — unlike
      # packages/kernel-ts's WASM build or apps/gateway/web's `dist/`
      # (both gitignored, built fresh by the `js`/`wasm` jobs below),
      # `ui/` has no run-time fallback if it's empty, so this job needs
      # Node/pnpm too, purely to produce it before any `cargo` command
      # below touches evermesh-node.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @evermesh/node-web build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  dmtap-pub:
    name: DMTAP-PUB §22 conformance (additive path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The §22 path is default-off, so the `rust` job above never builds it.
      # Without this job the convergence proof — that evermesh's §22 encoder
      # agrees byte-for-byte with the spec's frozen vectors — would only ever
      # have been run by hand. See docs/DMTAP-CONVERGENCE.md.
      - run: cargo clippy -p evermesh-kernel --features dmtap-pub --all-targets -- -D warnings
      - run: cargo test -p evermesh-kernel --features dmtap-pub
      # Fail loudly if the vector harness stops running, rather than passing
      # vacuously because the test was renamed or filtered out.
      - name: Assert the frozen §22 vectors actually ran
        run: |
          cargo test -p evermesh-kernel --features dmtap-pub \
            --test dmtap_pub_vectors -- --exact \
            dmtap_pub_conformance_vectors_agree_byte_for_byte \
            | tee /tmp/vec.log
          grep -q "1 passed" /tmp/vec.log

  # The `rust` job above already runs the conformance suite's *kernel*
  # target, because tools/conformance/tests/kernel_conformance.rs wires it
  # into `cargo test --workspace`. The other two runtimes need things a
  # plain `cargo test` cannot provide — a built WASM package, and a live
  # relay — so they get their own job here. Without it the "golden rule"
  # (the same vectors pass identically in every runtime) would be a claim
  # nothing in CI checks.
  #
  # Every target asserts itself against tools/conformance/coverage.json and
  # exits nonzero on any mismatch, so a harness that spawns, dies, and
  # checks nothing fails instead of printing an empty green table.
  conformance:
    name: Conformance (node + relay targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # node target: @evermesh/kernel wraps crates/evermesh-wasm, so the
      # WASM package has to exist before the harness can import it.
      - name: Build the WASM kernel for the node target
        run: pnpm --filter @evermesh/kernel build:wasm
      - name: Conformance — node target
        run: cargo run --bin evermesh-conformance -- run --target node

      # relay target: a real evermesh-relay over its /sync websocket.
      - name: Build the relay
        run: cargo build -p evermesh-relay
      - name: Boot a relay for the conformance run
        run: |
          mkdir -p /tmp/conformance-relay/blobs
          cat > /tmp/conformance-relay/relay.json <<'JSON'
          {
            "listen_addr": "127.0.0.1:8787",
            "db_path": "/tmp/conformance-relay/relay.sqlite3",
            "name": "ci-conformance-relay.local",
            "pow_min_bits": 0,
            "blob": { "enabled": true, "dir": "/tmp/conformance-relay/blobs", "max_bytes": 1073741824 }
          }
          JSON
          ./target/debug/evermesh-relay /tmp/conformance-relay/relay.json \
            > /tmp/conformance-relay/relay.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "http://127.0.0.1:8787/info"; then exit 0; fi
            sleep 1
          done
          echo "::error::relay did not come up in 30s"
          cat /tmp/conformance-relay/relay.log
          exit 1
      - name: Conformance — relay target
        run: cargo run --bin evermesh-conformance -- run --target relay --relay-url ws://127.0.0.1:8787/sync
      - name: Relay log
        if: always()
        run: cat /tmp/conformance-relay/relay.log || true

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p evermesh-wasm --target wasm32-unknown-unknown

  js:
    name: JS (lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @evermesh/kernel build:wasm
      # …and `build` too, which is a different script: build:wasm produces the
      # wasm artefact, `build` produces dist/index.d.ts. @evermesh/kernel's
      # "types" field points at that file, so without it every import of the
      # kernel resolves to an error type — and type-aware lint reports the
      # result as 220 "Unsafe assignment of an error typed value" errors in
      # gateway-server, which reads as a code problem rather than a missing
      # build step. It passed on developer machines purely because dist/ was
      # already lying around there. Verified by deleting dist/ locally and
      # reproducing the exact failure.
      - run: pnpm --filter @evermesh/kernel build
      # "lint" is real ESLint (type-aware) as of this repo's lint pass —
      # unused vars, floating promises, react-hooks correctness, import
      # hygiene. "typecheck" is the tsc --noEmit each package's "lint"
      # script used to be; kept as its own gate rather than folded away, so
      # this workflow still enforces both.
      - run: pnpm -r --if-present lint
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test

  # The landing page and docs are rendered in a real browser at eight widths in
  # both colour schemes, and all nineteen docs routes are loaded at 320 and 1440.
  # None of what this catches is visible in a diff: a diagram whose labels are
  # declared at 14px and drawn at 3.23px because the svg was fitted to the
  # column, a screenshot upscaled past its own resolution, a cross-page link to
  # an id the landing does not define.
  site-render:
    name: site/ renders correctly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # playwright is a root devDependency, so the gate resolves it from the
      # workspace install rather than carrying its own node_modules.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # The self-test runs FIRST and as its own step, so a gate that has stopped
      # discriminating stops the job before it can report a green. It breaks each
      # invariant on purpose and requires the check to notice.
      - name: Gate self-test
        run: node scripts/check-render.mjs --selftest

      - name: Render checks
        run: node scripts/check-render.mjs

      # This one already existed and nothing ran it: console errors, failed
      # requests, every internal link, and each doc route actually rendering.
      - name: Site link and console check
        run: node tools/site/check.mjs

      - name: site/docs is in sync with docs/
        run: node tools/site/sync-docs.mjs --check
