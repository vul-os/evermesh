[package]
name = "evermesh-kernel"
version = "0.0.1"
description = "The Evermesh protocol kernel: records, identity, blobs, bundles"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
blake3 = "1.5"
ed25519-dalek = "2.1"
getrandom = "0.2"

# DMTAP-PUB §22 substrate, CONSUMED (not reimplemented) from the KOTVA substrate's
# reference crate. See docs/DMTAP-CONVERGENCE.md: a second divergent implementation
# of §22 would defeat the point of converging, so this is a real dependency.
# Optional and default-off — the native evermesh format and the WASM build are
# untouched unless `--features dmtap-pub` is passed.
#
# The crate MOVED REPOSITORIES: it was `dmtap-core` inside envoir and was carved out
# to the KOTVA substrate repo as `kotva-core`, then PUBLISHED to crates.io. This
# manifest therefore names the published `kotva-core` but keeps the local alias
# `dmtap-core` via cargo's dependency-rename, so every `use dmtap_core::...` in
# src/dmtap_pub.rs keeps compiling and no source had to move for the migration.
#
# A REGISTRY dep also replaces a GIT dep that had quietly stopped being updatable:
# envoir deleted crates/dmtap-core at 620a68c, so the old `rev = 12526123...` pin
# still resolved (git history is immutable, and that rev is 52 commits behind
# envoir HEAD) but pointed at a tree that no longer exists upstream and could never
# receive another fix. It was a dead pin that still compiled — the worst kind.
dmtap-core = { package = "kotva-core", version = "0.2.0", optional = true }

[features]
default = []
# Additive §22 encode/decode path alongside the native evermesh format (phase 1).
# Enabling this changes NO existing byte format; it only adds `kernel::dmtap_pub`.
dmtap-pub = ["dep:dmtap-core"]

[dev-dependencies]
proptest = "1.5"
hex = "0.4"
serde_json = "1.0"
