<?xml version="1.0" encoding="UTF-8"?>
<!--
  A record is signed bytes that reference a blob by its hash, not by
  location. This card shows the shape of that: an Ed25519-signed envelope
  on the left, its own deterministic id, and — on the right — the blob it
  points at, addressed by a BLAKE3 chunk-tree root rather than a URL.
  Flat two-color style matching assets/logo.svg and architecture.svg, on a
  neutral card so it reads on any page background.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img"
     aria-label="Diagram: a signed record — an envelope with an Ed25519 signature and a deterministic id — carries a reference to a blob, addressed by the root of its BLAKE3 chunk tree rather than by location.">
  <title>A record is signed bytes; a blob is addressed by its own hash</title>

  <rect x="0" y="0" width="1000" height="320" rx="16" fill="#F0F2EC"/>

  <!-- record envelope -->
  <g>
    <rect x="60" y="70" width="320" height="180" rx="14" fill="none" stroke="#1E2620" stroke-width="6"/>
    <path d="M60,92 L220,190 L380,92" fill="none" stroke="#1E2620" stroke-width="5"/>
    <!-- wax seal / signature mark -->
    <circle cx="220" cy="190" r="26" fill="#4F6E09"/>
    <path d="M209,190 L217,199 L233,180" fill="none" stroke="#F0F2EC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="220" y="284" text-anchor="middle" font-family="'Hanken Grotesk',-apple-system,'Segoe UI',sans-serif" font-size="22" fill="#10140F">Record</text>
    <text x="220" y="20" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="14" fill="#4C554D">&#8203;</text>
  </g>
  <text x="220" y="42" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="14" letter-spacing="0.02em" fill="#4C554D">canonical CBOR &#183; Ed25519 signature</text>
  <text x="220" y="310" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" fill="#4C554D">id = hash(record) &#8212; deterministic</text>

  <!-- arrow: refs blob by hash -->
  <g stroke="#1E2620" stroke-width="4" fill="none">
    <path d="M395,160 H590" marker-end="url(#rec-arrow)"/>
  </g>
  <text x="492" y="140" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" fill="#4C554D">refs blob_hash</text>
  <defs>
    <marker id="rec-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1E2620"/>
    </marker>
  </defs>

  <!-- blob: chunk tree -->
  <g>
    <rect x="610" y="60" width="330" height="200" rx="14" fill="none" stroke="#1E2620" stroke-width="6"/>
    <!-- root hash bar -->
    <rect x="720" y="82" width="110" height="26" rx="6" fill="#1E2620"/>
    <text x="775" y="100" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#F0F2EC">root hash</text>
    <!-- tree edges -->
    <g stroke="#1E2620" stroke-width="3">
      <path d="M775,108 L700,150 M775,108 L850,150 M700,150 L665,195 M700,150 L735,195 M850,150 L815,195 M850,150 L885,195"/>
    </g>
    <!-- leaves: content chunks -->
    <g>
      <circle cx="700" cy="150" r="10" fill="none" stroke="#1E2620" stroke-width="4"/>
      <circle cx="850" cy="150" r="10" fill="none" stroke="#1E2620" stroke-width="4"/>
      <circle cx="665" cy="205" r="9" fill="#4F6E09"/>
      <circle cx="735" cy="205" r="9" fill="#4F6E09"/>
      <circle cx="815" cy="205" r="9" fill="#4F6E09"/>
      <circle cx="885" cy="205" r="9" fill="#4F6E09"/>
    </g>
    <text x="775" y="285" text-anchor="middle" font-family="'Hanken Grotesk',-apple-system,'Segoe UI',sans-serif" font-size="22" fill="#10140F">Blob</text>
  </g>
  <text x="775" y="40" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="14" letter-spacing="0.02em" fill="#4C554D">content-addressed &#183; BLAKE3 chunk tree</text>
  <text x="775" y="311" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" fill="#4C554D">a byte range proves itself without the whole file</text>
</svg>
