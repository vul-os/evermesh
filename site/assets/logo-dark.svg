<?xml version="1.0" encoding="UTF-8"?>
<!--
  Evermesh lockup — dark-background variant.

  Mark: a play triangle whose three vertices each throw an edge out to a
  mesh node — the same geometry as brand/logo.svg's icon (brand/ is
  FINAL and is never redrawn; this file only drops its dark tile so the
  mark sits directly on the page).

  Wordmark: "evermesh" set in the real Bricolage Grotesque ExtraBold
  (96pt optical size, for its character at this size) and traced to
  static path data with opentype.js, so the lockup still renders
  identically everywhere with nothing to load and no <text>/font-family
  — but from genuine type outlines instead of hand-plotted strokes
  imitating type (the 2026-07-31 redesign replaced the latter: its
  letterforms were visibly uneven at hero size).

  Colors: paper #F3F4F1 for structure, signal lime #A8E01F for the triangle —
  the bright end of the signal ramp: on carbon it is used at full
  strength (12.5:1 on #0B0B10).
-->
